# Intermediate flow format (human-reviewable source of truth).
# Body text is English; `note` and comments are for you (ignored by the tool).
# The builder adds Auto placement, a "Next ->" button + onClick per step, and an
# optional closing modal (ending). Bold (**text**) shows in the brand color via
# the FieldPie theme, so no color is set here.

flow:
  name: "Create a new form"
  # theme_id: "the_xxx"        # optional; falls back to USERTOUR_DEFAULT_THEME_ID
  ending:                      # optional closing modal (mirrors the standard finish screen)
    name: "Finish Screen"
    title: "You're all set."
    body: "Nice work — you just created your first form."
    home_url: "https://app.fieldpie.com"
    home_label: "Go back to home"
    button: "Finish"
    support: true

steps:
  - key: open-forms
    name: "Open Forms"
    target: { ref: forms-menu }          # resolved from schema/selectors.yaml
    body: "In the left menu, select **Forms**."
    # side/align optional (default bottom/center); alignment is always Auto.

  - key: new-form
    name: "Start a new form"
    target: { selector: "[data-action='new-form']" }   # inline selector, this flow only
    body: "Click **New form** to start from a blank form."
    # url: "https://app2.fieldpie.com/form"   # optional: also navigate on advance

  - key: edit-form
    name: "Edit the form"
    target: { ref: pencil-icon }
    body: "Use the **pencil** icon to open the form editor."
