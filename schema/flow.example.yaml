# Intermediate flow format - the human-reviewable source of truth.
# Content (name / title / body) is English; `note` and comments are for you.

flow:
  name: "Create a new form"
  # theme_id: "the_xxx"      # optional; falls back to USERTOUR_DEFAULT_THEME_ID

steps:
  - key: open-forms
    name: "Open Forms menu"
    type: tooltip
    target:
      ref: forms-menu               # resolved from schema/selectors.yaml
    placement: { side: right, align: start }
    title: "Open Forms"
    body: "Click **Forms** in the left menu to see all your forms."

  - key: new-form
    name: "Start a new form"
    type: tooltip
    target:
      selector: "[data-action='new-form']"   # inline selector, this flow only
      note: "Yeni form olustur butonu, sag ust"
    placement: { side: bottom, align: end }
    title: "Create a form"
    body: "Click **New form** to start from a blank form."

  - key: edit-form
    name: "Edit the form"
    type: tooltip
    target:
      ref: pencil-icon
    title: "Edit a form"
    body: "Use the pencil icon to open the form editor."

  - key: save
    name: "Save changes"
    type: tooltip
    target:
      ref: save-button
    title: "Save your work"
    body: "Click **Save** to apply your changes."
